<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AntiDOBOT</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>AntiDOBOT</h1>
    <form id="modes">
      <label class="option">
        <input type="radio" name="mode" value="nothing" />
        <span>Nothing</span>
      </label>
      <label class="option">
        <input type="radio" name="mode" value="delete" />
        <span>Delete</span>
      </label>
      <label class="option">
        <input type="radio" name="mode" value="raiden" />
        <span>Raiden</span>
      </label>
      <label class="option">
        <input type="radio" name="mode" value="neuvillette" />
        <span>Neuvillette</span>
      </label>
      <label class="option">
        <input type="radio" name="mode" value="custom" />
        <span>Custom</span>
      </label>
    </form>

    <section id="custom-panel" aria-hidden="true">
      <label class="field">
        <span>URL de imagen o GIF</span>
        <textarea id="custom-url" rows="3" placeholder="https://..."> </textarea>
      </label>
    <!--
      <label class="field">
        <span>Imagen local (opcional)</span>
        <input id="custom-file" type="file" accept="image/*" />
      </label>
    -->
      <button id="custom-save" type="button">Aplicar URL</button>
      <p id="custom-status" class="status" aria-live="polite"></p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
